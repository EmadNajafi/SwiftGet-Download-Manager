<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwiftGet</title>
<style>
  :root {
    --bg: #f4f6f9; --surface: #fff; --border: #e1e5ec; --text: #0f172a; --muted: #5b6474;
    --accent: #2563eb; --accent-soft: #e3ecfd; --ok: #16a34a; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --surface: #1c1f26; --border: #2c313b; --text: #f1f3f7; --muted: #a2aab8;
            --accent: #4d8bff; --accent-soft: #1e2a45; --ok: #34d399; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", Tahoma, sans-serif; }
  .hero { background: linear-gradient(135deg, #3b82f6, #4f46e5); color: #fff; padding: 36px 24px 72px; text-align: center; }
  .hero h1 { margin: 10px 0 6px; font-size: 28px; }
  .hero p { margin: 0; opacity: .92; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.18); display: inline-grid; place-items: center; }
  main { max-width: 760px; margin: -44px auto 40px; padding: 0 16px; display: grid; gap: 14px; }
  .step { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; gap: 16px; align-items: flex-start; box-shadow: 0 2px 10px rgba(15,23,42,.05); }
  .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; }
  .step h2 { margin: 3px 0 4px; font-size: 17px; }
  .step p { margin: 0; color: var(--muted); }
  .addr { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  code { direction: ltr; unicode-bidi: embed; font: 15px Consolas, "Cascadia Mono", monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; user-select: all; }
  button { font: inherit; font-weight: 600; border: none; border-radius: 8px; padding: 8px 16px; background: var(--accent); color: #fff; cursor: pointer; }
  button.done { background: var(--ok); }
  .mock { margin-top: 12px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--bg); font-size: 14px; }
  .toggle { width: 34px; height: 20px; border-radius: 10px; background: var(--accent); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 3px; inset-inline-end: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .drag { margin-top: 12px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .folder { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--accent); color: var(--text); font-weight: 600; }
  [dir="rtl"] .arrow { transform: scaleX(-1); }
  .done-card { text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="hero">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
    </div>
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
  </div>
  <main>
    <div class="step">
      <div class="num">1</div>
      <div>
        <h2 data-t="s1"></h2>
        <p data-t="s1p"></p>
        <div class="addr"><code id="addr"></code><button id="copy" data-t="copy"></button></div>
      </div>
    </div>
    <div class="step">
      <div class="num">2</div>
      <div>
        <h2 data-t="s2"></h2>
        <p data-t="s2p"></p>
        <div class="mock"><span>Developer mode</span><span class="toggle"></span></div>
      </div>
    </div>
    <div class="step">
      <div class="num">3</div>
      <div>
        <h2 data-t="s3"></h2>
        <p data-t="s3p"></p>
        <div class="drag">
          <span class="folder">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#f59e0b"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            extension
          </span>
          <svg class="arrow" width="40" height="16" viewBox="0 0 40 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8h34"/><path d="m30 3 6 5-6 5"/></svg>
          <span data-t="page"></span>
        </div>
      </div>
    </div>
    <p class="done-card" data-t="done"></p>
  </main>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") === "fa" ? "fa" : "en";
  const browser = (q.get("browser") || "chrome").toLowerCase();
  const scheme = { edge: "edge", brave: "brave", opera: "opera" }[browser] || "chrome";
  const address = scheme + "://extensions";
  const T = {
    en: {
      title: "Add SwiftGet to your browser", subtitle: "Three quick steps. You only do this once.",
      s1: "Open the extensions page", s1p: "The address below is already copied. Click the address bar, paste it (Ctrl+V) and press Enter.",
      copy: "Copy", copied: "Copied",
      s2: "Turn on Developer mode", s2p: "It's a switch on the extensions page (top right in Chrome, on the left in Edge).",
      s3: "Drag the extension folder onto the page", s3p: "SwiftGet opened the folder in Explorer. Drag the \"extension\" folder and drop it on the extensions page. (Or click \"Load unpacked\" and choose that folder.)",
      page: "extensions page",
      done: "That's it. The SwiftGet icon appears in the toolbar, and SwiftGet shows \"The extension is connected\" within a minute."
    },
    fa: {
      title: "افزودن SwiftGet به مرورگر", subtitle: "سه قدم کوتاه که فقط یک بار لازم است.",
      s1: "صفحهٔ افزونه‌ها را باز کنید", s1p: "آدرس زیر از قبل کپی شده است. روی نوار آدرس کلیک کنید، آن را بچسبانید (Ctrl+V) و Enter بزنید.",
      copy: "کپی", copied: "کپی شد",
      s2: "گزینهٔ Developer mode را روشن کنید", s2p: "یک کلید در صفحهٔ افزونه‌هاست (در Chrome بالا سمت راست، در Edge سمت چپ).",
      s3: "پوشهٔ افزونه را روی صفحه بکشید", s3p: "SwiftGet پوشه را در Explorer باز کرده است. پوشهٔ extension را با ماوس بکشید و روی صفحهٔ افزونه‌ها رها کنید (یا Load unpacked را بزنید و همان پوشه را انتخاب کنید).",
      page: "صفحهٔ افزونه‌ها",
      done: "تمام! آیکن SwiftGet در نوار ابزار مرورگر نمایش داده می‌شود و تا یک دقیقه در SwiftGet پیام «افزونه وصل است» دیده می‌شود."
    }
  }[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.title = T.title;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[el.dataset.t]));
  document.getElementById("addr").textContent = address;
  document.getElementById("copy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(address); }
    catch (_) { const r = document.createRange(); r.selectNodeContents(document.getElementById("addr")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
    e.target.textContent = T.copied; e.target.classList.add("done");
  });
</script>
</body>
</html>
